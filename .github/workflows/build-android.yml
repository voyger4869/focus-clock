name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          # 使用 ubuntu-latest 镜像预装的 Android SDK（无需第三方 action）
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          # 写入 local.properties 指向预装 SDK
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android-app/local.properties
          # 接受许可证（自动应答 yes）
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          # 确保 platform-tools 存在
          ls "$ANDROID_SDK_ROOT"

      - name: Grant gradlew execute permission
        run: chmod +x gradlew
        working-directory: android-app

      - name: Build release APK
        run: ./gradlew assembleRelease
        working-directory: android-app

      - name: Rename APK
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk \
             "focus-clock-android-${GITHUB_REF_NAME}.apk"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: focus-clock-android-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
