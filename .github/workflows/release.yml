name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 从 releases/ 目录收集本地已签名打包的 APK（中文名）
      # 复制为英文名，避免上传时中文编码问题
      - name: Collect local APK
        id: collect
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APK=$(ls releases/*.apk 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            echo "::error::releases/ 目录下未找到 APK，请先本地打包并放入 releases/ 目录"
            exit 1
          fi
          cp "$APK" "focus-clock-android-${TAG}.apk"
          echo "APK_FILE=focus-clock-android-${TAG}.apk" >> "$GITHUB_OUTPUT"
          echo "  ✓ 收集到 APK: $APK -> focus-clock-android-${TAG}.apk"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: focus-clock-android-*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
